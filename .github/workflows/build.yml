name: Build Disco Sauce

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: DiscoSauce-Windows-VST3
          path: build/DiscoSauce_artefacts/Release/VST3

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Zip VST3 bundle
        run: |
          cd build/DiscoSauce_artefacts/Release/VST3
          zip -r -y "$GITHUB_WORKSPACE/DiscoSauce-macOS-VST3.zip" "Disco Sauce.vst3"
      - name: Upload macOS VST3
        uses: actions/upload-artifact@v4
        with:
          name: DiscoSauce-macOS-VST3
          path: DiscoSauce-macOS-VST3.zip
